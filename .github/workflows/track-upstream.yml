name: 🔭 Track Upstream

# This snap is locked to the nextcloud snap's PHP: imagick.so must be built
# against the same PHP (API) nextcloud ships, and on the same base. It also
# owns ImageMagick's security updates, which the store's notice check
# (security-rebuild.yml) can't see because ImageMagick is self-built.
#
# Once a week (Mondays), .github/scripts/track_upstream.py compares our pins with:
# - the PHP tarball and base on nextcloud-snap `master` (what feeds
#   nextcloud's latest/stable);
# - the latest ImageMagick and imagick releases.
#
# On a change it commits the bumped pins straight to main and starts Snap
# Builds there - pushes made with the workflow token don't start workflows
# by themselves, but a workflow_dispatch does. When that passes (build,
# review, smoke test against nextcloud latest/stable), publish.yml releases
# it to stable. A failing build releases nothing and leaves main red, and
# GitHub emails you about the failed run.
#
# A PHP minor (API) change, a base change, or nextcloud-snap `develop`
# running ahead of `master` on either becomes an issue (label: upstream)
# instead, since this snap and nextcloud have to switch together.

on:
  schedule:
    - cron: "7 8 * * 1"  # weekly (Mondays), 08:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compare pins with upstream
        id: track
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/track_upstream.py

      - name: Raise issues that need a person
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(jq length issues.json)"
          [[ "$count" -gt 0 ]] || { echo "Nothing to raise."; exit 0; }
          gh label create "upstream" --repo "$GITHUB_REPOSITORY" --color "1D76DB" \
            --description "Upstream (nextcloud snap, ImageMagick, imagick) moved" 2>/dev/null || true
          for i in $(seq 0 $((count - 1))); do
            title="$(jq -r ".[$i].title" issues.json)"
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream --state open \
              --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number")"
            if [[ -n "$existing" ]]; then
              echo "Already open: #$existing $title"
              continue
            fi
            jq -r ".[$i].body" issues.json > issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --label upstream --title "$title" --body-file issue-body.md
          done

      - name: Commit the bump to main and build it
        if: steps.track.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.track.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -a -F - <<EOF
          ${TITLE}

          $(cat commit-body.txt)
          EOF
          git push origin HEAD:main
          gh workflow run snap-builds.yml --repo "$GITHUB_REPOSITORY" --ref main
